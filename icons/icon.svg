<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pokerat app icon</title>
  <desc id="desc">A dark rounded-square app icon featuring the Pokerat glowing hex emblem and spade flame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08101f"/>
      <stop offset="52%" stop-color="#060c17"/>
      <stop offset="100%" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#88e1ff" stop-opacity="0.88"/>
      <stop offset="26%" stop-color="#49b7ff" stop-opacity="0.66"/>
      <stop offset="58%" stop-color="#585dff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#08101f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73d7ff"/>
      <stop offset="50%" stop-color="#3e86ff"/>
      <stop offset="100%" stop-color="#7a5cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14233f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dffaff"/>
      <stop offset="24%" stop-color="#8fe3ff"/>
      <stop offset="55%" stop-color="#4ca7ff"/>
      <stop offset="100%" stop-color="#7058ff"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#63c6ff" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#6b5cff" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="220" r="122" fill="url(#aura)"/>
  <g filter="url(#softGlow)">
