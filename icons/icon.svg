    <path d="M256 107 356 161v112L256 327 156 273V161z" fill="none" stroke="url(#frame)" stroke-opacity="0.24" stroke-width="5"/>
    <path d="M220 131c13-9 59-9 72 0" stroke="#86e4ff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
    <path d="M144 220h18M350 220h18" stroke="#86d4ff" stroke-opacity="0.62" stroke-width="6" stroke-linecap="round"/>
    <path d="M256 138c22 37 52 54 52 89 0 32-22 57-52 72-30-15-52-40-52-72 0-35 30-52 52-89Z" fill="url(#flame)"/>
    <path d="M256 157c12 18 28 27 28 44 0 15-11 27-28 35-17-8-28-20-28-35 0-17 16-26 28-44Z" fill="#0a1120" fill-opacity="0.2"/>
    <path d="M256 142c8 16 17 26 17 36 0 9-6 17-17 23-11-6-17-14-17-23 0-10 9-20 17-36Z" fill="#fff" fill-opacity="0.24"/>
